<div class="isb-panel" role="search" aria-label="Flight instance search filters">

  <!-- Date From -->
  <div class="isb-field isb-field--date">
    <div class="isb-field__icon" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25
                 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0
                 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      </svg>
    </div>
    <input class="isb-input isb-input--date" type="date" [value]="dateFrom()"
      (change)="onDateFromChange($any($event.target).value)" [disabled]="loading()" aria-label="From date"
      title="From date">
    <label class="isb-date-label" aria-hidden="true">From</label>
  </div>

  <!-- Date divider arrow -->
  <div class="isb-date-sep" aria-hidden="true">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
    </svg>
  </div>

  <!-- Date To -->
  <div class="isb-field isb-field--date">
    <div class="isb-field__icon" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25
                 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0
                 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
      </svg>
    </div>
    <input class="isb-input isb-input--date" type="date" [value]="dateTo()"
      (change)="onDateToChange($any($event.target).value)" [disabled]="loading()" aria-label="To date" title="To date">
    <label class="isb-date-label" aria-hidden="true">To</label>
  </div>

  <!-- Vertical separator -->
  <div class="isb-sep" aria-hidden="true"></div>

  <!-- Flight Number -->
  <div class="isb-field isb-field--search">
    <div class="isb-field__icon" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27
                 20.875L5.999 12zm0 0h7.5" />
      </svg>
    </div>
    <input class="isb-input" type="text" [value]="flightNoVal()" (input)="onFlightNoInput($any($event.target).value)"
      placeholder="Flight No." maxlength="8" [disabled]="loading()" aria-label="Search by flight number"
      autocomplete="off">
  </div>

  <!-- Airport Code -->
  <div class="isb-field isb-field--iata">
    <div class="isb-field__icon" aria-hidden="true">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11.25l1.5 1.5.75-.75V8.758l2.276-.61a3 3 0 1 0-3.675-3.675l-.61 2.277
                 H12l-.75.75 1.5 1.5M15 11.25l-8.47 8.47c-.34.34-.8.53-1.28.53s-.94.19-1.28.53
                 l-.97.97-.75-.75.97-.97c.34-.34.53-.8.53-1.28s.19-.94.53-1.28L12.75 9M15 11.25
                 L12.75 9" />
      </svg>
    </div>
    <input class="isb-input isb-input--iata" type="text" [value]="airportVal()"
      (input)="onAirportInput($any($event.target).value)" placeholder="IATA" maxlength="4" [disabled]="loading()"
      aria-label="Filter by airport IATA code" autocomplete="off">
  </div>

  <!-- Status -->
  <div class="isb-field isb-field--status">
    <div class="isb-status-select-wrap">
      <select class="isb-status-select" [value]="statusVal()" (change)="onStatusChange($any($event.target).value)"
        [disabled]="loading()" aria-label="Filter by flight status">
        @for (opt of statusOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <div class="isb-status-select-wrap__chevron" aria-hidden="true">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <div class="isb-grow" aria-hidden="true"></div>

  <!-- Reset link -->
  @if (hasActiveFilter()) {
  <button class="isb-reset" type="button" [disabled]="loading()" (click)="reset()"
    aria-label="Reset all search filters">
    Reset
  </button>
  }

</div>
