<div class="ffb-panel">

    <!-- Left: View toggles + live indicators -->
    <div class="ffb-left">

        <!-- Departure / Arrival toggle — Gold-bordered glass buttons per spec -->
        <div class="ffb-view-toggle" role="group" aria-label="Toggle FIDS view">
            <button class="ffb-view-btn" [class.ffb-view-btn--active]="activeView() === 'DEPARTURES'" type="button"
                (click)="onViewToggle.emit('DEPARTURES')"
                aria-pressed="{{ activeView() === 'DEPARTURES' ? 'true' : 'false' }}">
                <svg fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768
                   0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
                </svg>
                Departures
                @if (boardingCount() > 0) {
                <span class="ffb-view-btn__badge ffb-view-btn__badge--boarding"
                    [attr.aria-label]="boardingCount() + ' flights boarding'">
                    {{ boardingCount() }}
                </span>
                }
            </button>

            <button class="ffb-view-btn" [class.ffb-view-btn--active]="activeView() === 'ARRIVALS'" type="button"
                (click)="onViewToggle.emit('ARRIVALS')"
                aria-pressed="{{ activeView() === 'ARRIVALS' ? 'true' : 'false' }}">
                <svg fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
                </svg>
                Arrivals
                @if (delayedCount() > 0) {
                <span class="ffb-view-btn__badge ffb-view-btn__badge--delayed"
                    [attr.aria-label]="delayedCount() + ' flights delayed'">
                    {{ delayedCount() }}
                </span>
                }
            </button>
        </div>

        <!-- Airport code context -->
        <div class="ffb-airport-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24"
                class="ffb-airport-wrap__icon" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0z" />
            </svg>
            <input class="ffb-airport-input" type="text" [value]="airportInput()"
                (input)="onAirportInputChange($any($event.target).value)" (blur)="applyAirport()"
                (keydown.enter)="applyAirport()" maxlength="4" aria-label="Airport IATA code" placeholder="IATA">
        </div>

    </div>

    <!-- Centre: filter controls -->
    <div class="ffb-filters">

        <!-- Gate filter -->
        <div class="ffb-filter-field">
            <label class="ffb-filter-label" for="ffb-gate">Gate / Hall</label>
            <input class="ffb-filter-input" id="ffb-gate" type="text" [value]="gateInput()"
                (input)="onGateChange($any($event.target).value)" placeholder="e.g. B12" maxlength="6"
                aria-label="Filter by gate">
        </div>

        <!-- Status filter -->
        <div class="ffb-filter-field">
            <label class="ffb-filter-label" for="ffb-status">Status</label>
            <div class="ffb-select-wrap">
                <select class="ffb-select" id="ffb-status" [value]="statusInput()"
                    (change)="onStatusChange($any($event.target).value)" aria-label="Filter by flight status">
                    @for (s of statuses; track s.value) {
                    <option [value]="s.value">{{ s.label }}</option>
                    }
                </select>
                <svg class="ffb-select-wrap__chev" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
                </svg>
            </div>
        </div>

        <!-- Airline filter -->
        <div class="ffb-filter-field">
            <label class="ffb-filter-label" for="ffb-airline">Airline</label>
            <input class="ffb-filter-input" id="ffb-airline" type="text" [value]="airlineInput()"
                (input)="onAirlineChange($any($event.target).value)" placeholder="e.g. Singapore"
                aria-label="Filter by airline name">
        </div>

        @if (hasFidsFilter()) {
        <button class="ffb-clear-btn" type="button" (click)="clearAll()" aria-label="Clear all filters">
            Clear
        </button>
        }

    </div>

    <!-- Right: Refresh + last updated -->
    <div class="ffb-right">
        <div class="ffb-ticker">
            <span class="ffb-ticker__label">Synced</span>
            <span class="ffb-ticker__time">{{ lastRefresh() }}</span>
        </div>
        <button class="ffb-refresh-btn" type="button" (click)="onRefresh.emit()" [disabled]="isLoading()"
            aria-label="Manual refresh FIDS data">
            <svg class="ffb-refresh-btn__icon" [class.ffb-refresh-btn__icon--spin]="isLoading()" fill="none"
                stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993
                 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25
                 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
        </button>
    </div>

</div>
