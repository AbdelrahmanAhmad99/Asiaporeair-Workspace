<div class="sfp-panel" role="search" aria-label="Schedule inventory filters">

    <!-- Flight No search -->
    <div class="sfp-field sfp-field--search">
        <div class="sfp-field__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
            </svg>
        </div>
        <input class="sfp-input" type="text" [value]="flightNoVal()"
            (input)="onFlightNoInput($any($event.target).value)" placeholder="Flight No. (e.g. SQ001)"
            aria-label="Search by flight number" autocomplete="off">
        @if (flightNoVal()) {
        <button class="sfp-field__clear" type="button" (click)="onFlightNoInput('')" aria-label="Clear flight number">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
        }
    </div>

    <!-- Route ID -->
    <div class="sfp-field sfp-field--narrow">
        <div class="sfp-field__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
            </svg>
        </div>
        <input class="sfp-input" type="number" min="1" [value]="routeIdVal()"
            (input)="onRouteIdInput($any($event.target).value)" placeholder="Route ID" aria-label="Filter by route ID"
            autocomplete="off">
    </div>

    <!-- Season dropdown -->
    <div class="sfp-field sfp-field--select">
        <select class="sfp-select" [value]="seasonVal()" (change)="onSeasonChange($any($event.target).value)"
            aria-label="Filter by season">
            <option value="">All Seasons</option>
            <option value="SUMMER">Summer (Mar–Oct)</option>
            <option value="WINTER">Winter (Nov–Feb)</option>
        </select>
        <div class="sfp-select__chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
            </svg>
        </div>
    </div>

    <!-- Status dropdown -->
    <div class="sfp-field sfp-field--select">
        <select class="sfp-select" [value]="statusVal()" (change)="onStatusChange($any($event.target).value)"
            aria-label="Filter by status">
            <option value="">All Statuses</option>
            <option value="true">Active Only</option>
            <option value="false">Inactive Only</option>
        </select>
        <div class="sfp-select__chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
            </svg>
        </div>
    </div>

    <!-- Spacer -->
    <div class="sfp-spacer" aria-hidden="true"></div>

    <!-- Reset link -->
    @if (hasActiveFilter()) {
    <button class="sfp-reset-link" type="button" (click)="reset()" [disabled]="loading()"
        aria-label="Clear all filters">
        Clear Filters
    </button>
    }

</div>
