<!-- booking-action-bar.component.html -->

<div class="bab-bar">
    <p class="bab-bar__title">Administrative Actions</p>

    <button class="bab-btn bab-btn--status" type="button" [disabled]="actionProcessing() || isCancelled()"
        (click)="updateStatusRequested.emit()">
        @if (isPatching()) {
        <svg class="bab-btn__icon bab-btn__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5"
            viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Applying…
        } @else {
        <svg class="bab-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Update Status
        }
    </button>

    <!-- Issue Tickets -->
    <button class="bab-btn bab-btn--tickets" type="button" [disabled]="actionProcessing() || isCancelled()"
        (click)="issueTicketsRequested.emit()" title="Issue e-Tickets for this booking">
        <svg class="bab-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a3 3 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375z" />
        </svg>
        Issue Tickets
    </button>

    <!-- Cancel Booking (danger) -->
    <button class="bab-btn bab-btn--cancel" type="button" [disabled]="actionProcessing() || isCancelled()"
        (click)="cancelRequested.emit()">
        @if (isCancelling()) {
        <svg class="bab-btn__icon bab-btn__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5"
            viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Cancelling…
        } @else {
        <svg class="bab-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M18.364 18.364A9 9 0 0 0 5.636 5.636m12.728 12.728A9 9 0 0 1 5.636 5.636m12.728 12.728L5.636 5.636" />
        </svg>
        Cancel Booking
        }
    </button>

    @if (isCancelled()) {
    <p class="bab-bar__archived-note">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
        This booking is archived. No further actions available.
    </p>
    }
</div>
