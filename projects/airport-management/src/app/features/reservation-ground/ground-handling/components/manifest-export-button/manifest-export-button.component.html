<div class="meb-wrap" (focusout)="onBlur()">

  <button class="meb-btn" type="button" [disabled]="disabled() || isLoading()" [attr.aria-expanded]="menuOpen()"
    aria-haspopup="menu" (click)="toggleMenu()">

    @if (isLoading()) {
    <svg class="meb-btn__icon meb-btn__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5"
      viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    Exporting…
    } @else {
    <svg class="meb-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
      aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z" />
    </svg>
    Generate Official Manifest
    <svg class="meb-btn__caret" [class.meb-btn__caret--open]="menuOpen()" fill="none" stroke="currentColor"
      stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
    }
  </button>

  <!-- Format selector menu -->
  @if (menuOpen()) {
  <div class="meb-menu" role="menu" aria-label="Export format selection">
    <button class="meb-menu__item" type="button" role="menuitem" (click)="select('PDF')">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9z" />
      </svg>
      <div class="meb-menu__text">
        <span class="meb-menu__label">PDF Document</span>
        <span class="meb-menu__hint">Official manifest for pilot &amp; authorities</span>
      </div>
    </button>

    <button class="meb-menu__item" type="button" role="menuitem" (click)="select('EXCEL')">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-13.5-1.5-.5 1.5M9 11.25v-1.5M12 11.25v-3M15 11.25v-4.5" />
      </svg>
      <div class="meb-menu__text">
        <span class="meb-menu__label">Excel Spreadsheet</span>
        <span class="meb-menu__hint">Editable manifest for ops records</span>
      </div>
    </button>

    <button class="meb-menu__item" type="button" role="menuitem" (click)="select('CSV')">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
      </svg>
      <div class="meb-menu__text">
        <span class="meb-menu__label">CSV Export</span>
        <span class="meb-menu__hint">Quick download for local processing</span>
      </div>
    </button>
  </div>
  }

</div>
