<div class="sif-card">

    <!-- ── Card Header ────────────────────────────────────────────── -->
    <div class="sif-card-header">
        <svg class="sif-card-header__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.115 5.19l.319 1.913A6 6 0 0 0 8.11 10.36L9.75 12l-.387.775c-.217.433-.132.956.21 1.298l1.348 1.348c.21.21.329.497.329.795v1.089c0 .426.24.815.622 1.006l.153.076c.433.217.956.132 1.298-.21l.723-.723a8.7 8.7 0 0 0 2.288-4.042 1.087 1.087 0 0 0-.358-1.099l-1.33-1.108c-.251-.21-.582-.299-.905-.245l-1.17.195a1.125 1.125 0 0 1-.98-.314l-.295-.295a1.125 1.125 0 0 1 0-1.591l.13-.132a1.125 1.125 0 0 1 1.3-.21l.603.302a.809.809 0 0 0 1.086-1.086L14.25 7.5l1.256-.837a4.5 4.5 0 0 1 1.528-.68l1.996-.497a4.5 4.5 0 0 1 .328 2.807 4.5 4.5 0 0 1-1.596 2.67A8.29 8.29 0 0 1 12 14.25a8.302 8.302 0 0 1-3.49-.751" />
        </svg>
        <div>
            <h3 class="sif-card-header__title">Scenario Builder</h3>
            <p class="sif-card-header__sub">Define the flight context to simulate</p>
        </div>
    </div>

    <!-- ── Form ───────────────────────────────────────────────────── -->
    <form class="sif-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- ─ Route Section ──────────────────────────────────────── -->
        <div class="sif-section">
            <p class="sif-section__label">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
                </svg>
                Route
            </p>

            <div class="sif-row sif-row--2col">
                <div class="sif-field">
                    <label class="sif-label" for="sif-origin">Origin</label>
                    <input id="sif-origin" class="sif-input" [class.sif-input--error]="isInvalid('origin')" type="text"
                        formControlName="origin" placeholder="SIN" maxlength="3" autocomplete="off" spellcheck="false"
                        style="text-transform:uppercase" aria-label="Origin IATA code" />
                    @if (isInvalid('origin')) {
                    <p class="sif-error" role="alert">{{ getError('origin') }}</p>
                    }
                </div>

                <div class="sif-field">
                    <label class="sif-label" for="sif-dest">Destination</label>
                    <input id="sif-dest" class="sif-input" [class.sif-input--error]="isInvalid('destination')"
                        type="text" formControlName="destination" placeholder="LHR" maxlength="3" autocomplete="off"
                        spellcheck="false" style="text-transform:uppercase" aria-label="Destination IATA code" />
                    @if (isInvalid('destination')) {
                    <p class="sif-error" role="alert">{{ getError('destination') }}</p>
                    }
                </div>
            </div>
        </div>

        <!-- ─ Travel Details Section ─────────────────────────────── -->
        <div class="sif-section">
            <p class="sif-section__label">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                </svg>
                Travel Details
            </p>

            <div class="sif-row sif-row--2col">
                <div class="sif-field">
                    <label class="sif-label" for="sif-date">Travel Date</label>
                    <input id="sif-date" class="sif-input sif-input--date" type="date" formControlName="travelDate"
                        aria-label="Travel date" />
                </div>

                <div class="sif-field">
                    <label class="sif-label" for="sif-dtd">Days to Departure</label>
                    <input id="sif-dtd" class="sif-input" [class.sif-input--error]="isInvalid('daysToDeparture')"
                        type="number" formControlName="daysToDeparture" placeholder="e.g. 30" min="0" max="365" step="1"
                        aria-label="Days to departure" />
                    @if (isInvalid('daysToDeparture')) {
                    <p class="sif-error" role="alert">{{ getError('daysToDeparture') }}</p>
                    }
                </div>
            </div>
        </div>

        <!-- ─ Passenger Profile Section ──────────────────────────── -->
        <div class="sif-section">
            <p class="sif-section__label">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0zM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                Passenger Profile
            </p>

            <div class="sif-field">
                <label class="sif-label" for="sif-class">Booking Class</label>
                <div class="sif-select-wrap">
                    <select id="sif-class" class="sif-select" formControlName="bookingClass" aria-label="Booking class">
                        @for (cls of bookingClasses; track cls.value) {
                        <option [value]="cls.value">{{ cls.label }}</option>
                        }
                    </select>
                    <svg class="sif-select-wrap__chevron" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
                    </svg>
                </div>
            </div>

            <div class="sif-field">
                <label class="sif-label" for="sif-tier">KrisFlyer Tier</label>
                <div class="sif-select-wrap">
                    <select id="sif-tier" class="sif-select" formControlName="frequentFlyerTier"
                        aria-label="KrisFlyer tier">
                        @for (tier of loyaltyTiers; track tier.value) {
                        <option [value]="tier.value">{{ tier.label }}</option>
                        }
                    </select>
                    <svg class="sif-select-wrap__chevron" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
                    </svg>
                </div>
            </div>

            <div class="sif-field">
                <label class="sif-label" for="sif-season">Seasonality</label>
                <div class="sif-select-wrap">
                    <select id="sif-season" class="sif-select" formControlName="seasonality"
                        aria-label="Seasonality context">
                        @for (s of seasonalityOptions; track s.value) {
                        <option [value]="s.value">{{ s.label }}</option>
                        }
                    </select>
                    <svg class="sif-select-wrap__chevron" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- ─ Actions ─────────────────────────────────────────────── -->
        <div class="sif-actions">
            <button class="sif-btn sif-btn--reset" type="button" (click)="onReset()" [disabled]="isSimulating()">
                Clear
            </button>
            <button class="sif-btn sif-btn--run" type="submit" [disabled]="isSimulating()">
                @if (isSimulating()) {
                <svg class="sif-btn__spinner" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                Running…
                } @else {
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
                </svg>
                Run Simulation
                }
            </button>
        </div>

    </form>
</div>
