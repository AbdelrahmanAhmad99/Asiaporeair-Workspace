<div class="asf-panel" role="search" aria-label="Partner fleet search and filter">

    <!-- ── Search Input ──────────────────────────────────────────── -->
    <div class="asf-field asf-field--search">
        <div class="asf-field__icon-wrap" aria-hidden="true">
            <svg class="asf-field__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
            </svg>
        </div>
        <input class="asf-input" type="text" [value]="searchValue()" (input)="onSearchInput($any($event.target).value)"
            placeholder="Search for Partner…" autocomplete="off" aria-label="Search partner airlines by name">
        @if (searchValue()) {
        <button class="asf-field__clear" type="button" (click)="onSearchInput('')" aria-label="Clear search">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
        }
    </div>

    <!-- ── Region Dropdown ───────────────────────────────────────── -->
    <div class="asf-field asf-field--region">
        <div class="asf-field__icon-wrap" aria-hidden="true">
            <svg class="asf-field__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z" />
            </svg>
        </div>
        <select class="asf-select" [value]="regionValue()" (change)="onRegionChange($any($event.target).value)"
            aria-label="Filter by operating region">
            <option value="">All Regions</option>
            @for (r of regions; track r) {
            <option [value]="r">{{ r }}</option>
            }
        </select>
        <div class="asf-select__chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
            </svg>
        </div>
    </div>

    <!-- ── Spacer ─────────────────────────────────────────────────── -->
    <div class="asf-spacer" aria-hidden="true"></div>

    <!-- ── Clear Filters (conditional) ──────────────────────────── -->
    @if (hasActiveFilter()) {
    <button class="asf-btn asf-btn--clear" type="button" (click)="clear()" [disabled]="loading()"
        aria-label="Clear all filters">
        <svg class="asf-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Reset
    </button>
    }

    <!-- ── Separator ─────────────────────────────────────────────── -->
    <div class="asf-sep" aria-hidden="true"></div>

    <!-- ── Add New Partner ───────────────────────────────────────── -->
    <button class="asf-btn asf-btn--add" type="button" (click)="addNew()" aria-label="Onboard a new airline partner">
        <svg class="asf-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Onboard Partner
    </button>

</div>
