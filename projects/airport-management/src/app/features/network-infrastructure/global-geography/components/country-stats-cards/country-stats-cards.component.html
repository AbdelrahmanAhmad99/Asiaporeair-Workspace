<div class="stats-grid">

  @for (card of statCards(); track card.label) {

  <div class="stats-card">

    <!-- Gold accent bar (left edge — animated on hover) -->
    <div class="stats-card__accent-bar" aria-hidden="true"></div>

    <!-- Top Row: label + icon -->
    <div class="stats-card__header">
      <span class="stats-card__label">{{ card.label }}</span>

      <div class="stats-card__icon-wrap">
        <svg class="stats-card__icon-wrap__svg" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="card.iconPath" />
        </svg>
      </div>
    </div>

    <!-- Metric Value -->
    <p class="stats-card__value">{{ card.value }}</p>

    <!-- Optional Subtitle -->
    @if (card.subtitle) {
    <p class="stats-card__subtitle">{{ card.subtitle }}</p>
    }

  </div>

  }

</div>
