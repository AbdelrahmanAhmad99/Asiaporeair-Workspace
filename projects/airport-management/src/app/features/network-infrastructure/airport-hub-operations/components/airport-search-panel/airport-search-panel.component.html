<div class="asp-panel" role="search" aria-label="Airport search panel">

    <form class="asp-form" [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="off">

        <!-- ── Fields Row ──────────────────────────────────────────────── -->
        <div class="asp-fields">

            <!-- IATA Code -->
            <div class="asp-field">
                <input id="sp-iata" class="asp-input" type="text" formControlName="iataCode" maxlength="3"
                    placeholder=" " [attr.aria-label]="'IATA Code — 3 letters'">
                <label class="asp-label" for="sp-iata">
                    <svg class="asp-label__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
                    </svg>
                    IATA
                </label>
                <span class="asp-field__badge">3</span>
            </div>

            <!-- ICAO Code -->
            <div class="asp-field">
                <input id="sp-icao" class="asp-input" type="text" formControlName="icaoCode" maxlength="4"
                    placeholder=" " [attr.aria-label]="'ICAO Code — 4 letters'">
                <label class="asp-label" for="sp-icao">
                    <svg class="asp-label__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21" />
                    </svg>
                    ICAO
                </label>
                <span class="asp-field__badge">4</span>
            </div>

            <!-- City -->
            <div class="asp-field asp-field--wide">
                <input id="sp-city" class="asp-input" type="text" formControlName="city" placeholder=" "
                    [attr.aria-label]="'City name'">
                <label class="asp-label" for="sp-city">
                    <svg class="asp-label__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0z" />
                    </svg>
                    City
                </label>
            </div>

            <!-- Country ISO -->
            <div class="asp-field">
                <input id="sp-country" class="asp-input" type="text" formControlName="countryIsoCode" maxlength="2"
                    placeholder=" " [attr.aria-label]="'Country ISO code — 2 letters'">
                <label class="asp-label" for="sp-country">
                    <svg class="asp-label__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                        viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3" />
                    </svg>
                    Country
                </label>
                <span class="asp-field__badge">ISO</span>
            </div>

        </div>

        <!-- ── Action Buttons ──────────────────────────────────────────── -->
        <div class="asp-actions">

            <!-- Clear (shown when any field has value) -->
            @if (hasValues) {
            <button type="button" class="asp-btn asp-btn--clear" (click)="clear()" [disabled]="loading()"
                aria-label="Clear search filters" title="Clear filters">
                <svg class="asp-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
            }

            <!-- Search -->
            <button type="submit" class="asp-btn asp-btn--search" [disabled]="loading()" aria-label="Search airports">
                @if (loading()) {
                <svg class="asp-btn__icon asp-btn__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                } @else {
                <svg class="asp-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
                </svg>
                }
                Search
            </button>

            <!-- Separator -->
            <div class="asp-separator" aria-hidden="true"></div>

            <!-- Add New Airport -->
            <button type="button" class="asp-btn asp-btn--add" (click)="addNew()" aria-label="Add new airport"
                title="New Airport">
                <svg class="asp-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                New Airport
            </button>

        </div>

    </form>

</div>
