<button class="rab-btn" type="button" [class.rab-btn--loading]="isThisRestoring()"
    [class.rab-btn--disabled]="isAnyRestoring() && !isThisRestoring()" [disabled]="disabled() || isAnyRestoring()"
    (click)="onRestore()" [attr.aria-label]="'Restore airport ' + iataCode() + ' to the active network'"
    [attr.title]="isThisRestoring() ? 'Restoring ' + iataCode() + '…' : 'Restore ' + iataCode()">

    <!-- Spinner (when THIS record is restoring) -->
    @if (isThisRestoring()) {
    <svg class="rab-btn__icon rab-btn__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5"
        viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
               3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
               13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    <span class="rab-btn__label">Restoring…</span>
    }

    <!-- Restore icon (idle state) -->
    @if (!isThisRestoring()) {
    <svg class="rab-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993
               0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25
               0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    <span class="rab-btn__label">Restore</span>
    }

</button>
