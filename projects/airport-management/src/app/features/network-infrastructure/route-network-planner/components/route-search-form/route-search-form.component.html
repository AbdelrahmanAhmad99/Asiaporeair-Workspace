<div class="rsf-panel" role="search" aria-label="Route network search">

    <!-- Origin IATA -->
    <div class="rsf-field rsf-field--iata">
        <div class="rsf-field__icon-wrap" aria-hidden="true">
            <svg class="rsf-field__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15 11.25l1.5 1.5.75-.75V8.758l2.276-.61a3 3 0 1 0-3.675-3.675
                 l-.61 2.277H12l-.75.75 1.5 1.5M15 11.25l-8.47 8.47c-.34.34-.8.53-1.28.53s-.94.19-1.28.53l-.97.97-.75-.75.97-.97c.34-.34.53-.8.53-1.28s.19-.94.53-1.28L12.75 9M15 11.25L12.75 9" />
            </svg>
        </div>
        <input id="rsf-origin" class="rsf-input" type="text" [value]="originVal()"
            (input)="onOriginInput($any($event.target).value)" placeholder="Origin Hub" maxlength="4" autocomplete="off"
            aria-label="Origin airport IATA code">
        @if (originVal()) {
        <button class="rsf-field__clear" type="button" (click)="onOriginInput('')" aria-label="Clear origin">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
        }
    </div>

    <!-- Arrow separator -->
    <div class="rsf-arrow" aria-hidden="true">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
        </svg>
    </div>

    <!-- Destination IATA -->
    <div class="rsf-field rsf-field--iata">
        <div class="rsf-field__icon-wrap" aria-hidden="true">
            <svg class="rsf-field__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768
                 0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
            </svg>
        </div>
        <input id="rsf-dest" class="rsf-input" type="text" [value]="destinationVal()"
            (input)="onDestInput($any($event.target).value)" placeholder="Destination Hub" maxlength="4"
            autocomplete="off" aria-label="Destination airport IATA code">
        @if (destinationVal()) {
        <button class="rsf-field__clear" type="button" (click)="onDestInput('')" aria-label="Clear destination">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
        }
    </div>

    <!-- Status dropdown -->
    <div class="rsf-field rsf-field--status">
        <select class="rsf-select" [value]="statusVal() === null ? '' : statusVal()"
            (change)="onStatusChange($any($event.target).value)" aria-label="Route status filter">
            @for (opt of statusOptions; track opt.label) {
            <option [value]="opt.value === null ? '' : opt.value">{{ opt.label }}</option>
            }
        </select>
        <div class="rsf-select__chevron" aria-hidden="true">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
            </svg>
        </div>
    </div>

    <!-- Spacer -->
    <div class="rsf-spacer" aria-hidden="true"></div>

    <!-- Reset gold-link -->
    @if (hasActiveFilter()) {
    <button class="rsf-reset-link" type="button" (click)="reset()" [disabled]="loading()"
        aria-label="Reset network view">
        Reset Network View
    </button>
    }

    <!-- Search Corridors primary CTA -->
    <button class="rsf-btn-search" type="button" (click)="search()" [disabled]="loading()"
        aria-label="Search air corridors">
        @if (loading()) {
        <svg class="rsf-btn-search__spin" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993
                 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25
                 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        } @else {
        <svg class="rsf-btn-search__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607z" />
        </svg>
        }
        Search Corridors
    </button>

</div>
