<form class="fpf" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <!-- Email field -->
    <div class="fpf__field" [class.fpf__field--error]="isInvalid">
        <input class="fpf__input" id="fpf-email" type="email" formControlName="email" placeholder=" "
            autocomplete="email" [attr.aria-invalid]="isInvalid" aria-describedby="fpf-email-err" />
        <label class="fpf__label" for="fpf-email">Registered Email Address</label>
        <div class="fpf__bar" aria-hidden="true"></div>

        @if (isInvalid) {
        <span class="fpf__error" id="fpf-email-err" role="alert">{{ errorMessage }}</span>
        }
    </div>

    <!-- Submit -->
    <button class="fpf__submit" type="submit" [disabled]="isLoading" [class.fpf__submit--loading]="isLoading"
        aria-label="Send password recovery link">
        @if (isLoading) {
        <span class="fpf__spinner" aria-hidden="true"></span>
        Sending Recovery Link…
        } @else {
        Send Recovery Link
        }
    </button>

</form>
