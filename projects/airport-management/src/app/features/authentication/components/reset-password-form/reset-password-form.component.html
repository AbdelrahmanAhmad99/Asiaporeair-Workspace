<form class="rpf" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

    <!-- ── New Password ────────────────────────────────────────────────────── -->
    <div class="rpf__field" [class.rpf__field--error]="isInvalid('newPassword')">
        <input class="rpf__input" id="rpf-new-pw" [type]="showNew ? 'text' : 'password'" formControlName="newPassword"
            placeholder=" " autocomplete="new-password" [attr.aria-invalid]="isInvalid('newPassword')"
            aria-describedby="rpf-new-err" />
        <label class="rpf__label" for="rpf-new-pw">New Password</label>
        <div class="rpf__bar" aria-hidden="true"></div>

        <button class="rpf__eye" type="button" (click)="showNew = !showNew"
            [attr.aria-label]="showNew ? 'Hide password' : 'Show password'">
            @if (showNew) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            }
        </button>

        @if (isInvalid('newPassword')) {
        <span class="rpf__error" id="rpf-new-err" role="alert">{{ errorFor('newPassword') }}</span>
        }
    </div>

    <!-- Password requirements hint -->
    <ul class="rpf__requirements" aria-label="Password requirements">
        <li [class.rpf__req--met]="(form.get('newPassword')?.value?.length ?? 0) >= 8">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            At least 8 characters
        </li>
        <li
            [class.rpf__req--met]="!!form.get('newPassword')?.value?.match(/[A-Z]/) && !!form.get('newPassword')?.value?.match(/[a-z]/)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Uppercase and lowercase letters
        </li>
        <li
            [class.rpf__req--met]="!!form.get('newPassword')?.value?.match(/\d/) && !!form.get('newPassword')?.value?.match(/[\W_]/)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            A number and a special character
        </li>
    </ul>

    <!-- ── Confirm Password ──────────────────────────────────────────────────── -->
    <div class="rpf__field" [class.rpf__field--error]="isInvalid('confirmPassword') || mismatch">
        <input class="rpf__input" id="rpf-confirm-pw" [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword" placeholder=" " autocomplete="new-password"
            [attr.aria-invalid]="isInvalid('confirmPassword') || mismatch" aria-describedby="rpf-confirm-err" />
        <label class="rpf__label" for="rpf-confirm-pw">Confirm New Password</label>
        <div class="rpf__bar" aria-hidden="true"></div>

        <button class="rpf__eye" type="button" (click)="showConfirm = !showConfirm"
            [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'">
            @if (showConfirm) {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            }
        </button>

        @if (mismatch) {
        <span class="rpf__error" id="rpf-confirm-err" role="alert">Passwords do not match.</span>
        } @else if (isInvalid('confirmPassword')) {
        <span class="rpf__error" id="rpf-confirm-err" role="alert">{{ errorFor('confirmPassword') }}</span>
        }
    </div>

    <!-- ── Submit ──────────────────────────────────────────────────────────── -->
    <button class="rpf__submit" type="submit" [disabled]="isLoading" [class.rpf__submit--loading]="isLoading"
        aria-label="Set new password">
        @if (isLoading) {
        <span class="rpf__spinner" aria-hidden="true"></span>
        Updating Password…
        } @else {
        Set New Password
        }
    </button>

</form>
