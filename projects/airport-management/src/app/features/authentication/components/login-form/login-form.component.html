<form class="lf" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="on">

    <!-- ── Email ───────────────────────────────────────────────────────────── -->
    <div class="lf__field" [class.lf__field--error]="isInvalid('email')">
        <input class="lf__input" id="lf-email" type="email" formControlName="email" placeholder=" " autocomplete="email"
            [attr.aria-invalid]="isInvalid('email')" aria-describedby="lf-email-err" />
        <label class="lf__label" for="lf-email">Email Address</label>
        <div class="lf__bar" aria-hidden="true"></div>

        @if (isInvalid('email')) {
        <span class="lf__error" id="lf-email-err" role="alert">{{ errorFor('email') }}</span>
        }
    </div>

    <!-- ── Password ────────────────────────────────────────────────────────── -->
    <div class="lf__field" [class.lf__field--error]="isInvalid('password')">
        <input class="lf__input" id="lf-password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder=" " autocomplete="current-password" [attr.aria-invalid]="isInvalid('password')"
            aria-describedby="lf-pw-err" />
        <label class="lf__label" for="lf-password">Password</label>
        <div class="lf__bar" aria-hidden="true"></div>

        <button class="lf__eye" type="button" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" tabindex="0">
            @if (showPassword) {
            <!-- eye-off -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <!-- eye -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            }
        </button>

        @if (isInvalid('password')) {
        <span class="lf__error" id="lf-pw-err" role="alert">{{ errorFor('password') }}</span>
        }
    </div>

    <!-- ── Forgot password ─────────────────────────────────────────────────── -->
    <div class="lf__forgot-row">
        <a class="lf__forgot-link" routerLink="/auth/forgot-password">
            Forgot your password?
        </a>
    </div>

    <!-- ── Submit ──────────────────────────────────────────────────────────── -->
    <button class="lf__submit" type="submit" [disabled]="isLoading" [class.lf__submit--loading]="isLoading"
        aria-label="Sign in to your Asiaporeair account">
        @if (isLoading) {
        <span class="lf__spinner" aria-hidden="true"></span>
        Signing In…
        } @else {
        Access Your Suite
        }
    </button>

</form>
