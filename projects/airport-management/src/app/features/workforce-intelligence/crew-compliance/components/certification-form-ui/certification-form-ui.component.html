<div class="form-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true"
  [attr.aria-labelledby]="'cert-form-title'">

  <div class="form-dialog">

    <!-- Dialog Header -->
    <div class="form-dialog__header">
      <div class="form-dialog__icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
      </div>
      <div>
        <p class="form-dialog__eyebrow">CREDENTIAL MANAGEMENT SYSTEM</p>
        <h2 class="form-dialog__title" id="cert-form-title">{{ dialogTitle() }}</h2>
      </div>
      <button class="form-dialog__close" (click)="onCancel()" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form Body -->
    <form class="form-body" (ngSubmit)="onSubmit()" novalidate>

      <!-- Credential Name Field -->
      <div class="form-field" [class.form-field--error]="errors().certificationName">
        <label class="form-label" for="cert-name-input">
          Credential / License Name
          <span class="required-mark">*</span>
        </label>
        <input id="cert-name-input" class="form-input" type="text"
          placeholder="e.g. ATPL, Medical Class 1, Type Rating B777…" [value]="certName()" (input)="onNameInput($event)"
          autocomplete="off" />
        @if (errors().certificationName) {
        <span class="field-error-msg">{{ errors().certificationName }}</span>
        }
      </div>

      <!-- Credential Type (Category) -->
      <div class="form-field" [class.form-field--error]="errors().type">
        <label class="form-label" for="cert-type-input">
          Classification Category
          <span class="required-mark">*</span>
        </label>
        <input id="cert-type-input" class="form-input" type="text" placeholder="e.g. Technical, Safety, Medical…"
          [value]="type()" (input)="onTypeInput($event)" autocomplete="off" />
        @if (errors().type) {
        <span class="field-error-msg">{{ errors().type }}</span>
        }
      </div>

      <!-- Date Fields Row -->
      <div class="form-dates-row">
        <!-- Issue Date -->
        <div class="form-field" [class.form-field--error]="errors().issueDate">
          <label class="form-label" for="issue-date-input">
            Issue Date
            <span class="required-mark">*</span>
          </label>
          <input id="issue-date-input" class="form-input" type="date" [value]="issueDate()"
            (input)="onIssueDateInput($event)" />
          @if (errors().issueDate) {
          <span class="field-error-msg">{{ errors().issueDate }}</span>
          }
        </div>

        <!-- Expiry Date -->
        <div class="form-field" [class.form-field--error]="errors().expiryDate">
          <label class="form-label" for="expiry-date-input">
            Expiry Date
            <span class="required-mark">*</span>
          </label>
          <input id="expiry-date-input" class="form-input" type="date" [value]="expiryDate()"
            (input)="onExpiryDateInput($event)" />
          @if (errors().expiryDate) {
          <span class="field-error-msg">{{ errors().expiryDate }}</span>
          }
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()" id="cert-form-cancel-btn">
          Cancel Procedure
        </button>
        <button type="submit" class="btn-submit" [class.btn-submit--pulse]="isValid()" [disabled]="isProcessing()"
          id="cert-form-submit-btn">
          @if (isProcessing()) {
          <span class="spinner"></span>
          Processing…
          } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
          </svg>
          {{ submitLabel() }}
          }
        </button>
      </div>

    </form>
  </div>
</div>
