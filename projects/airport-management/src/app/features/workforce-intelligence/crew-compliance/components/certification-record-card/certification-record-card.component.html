<article class="cert-card" [class]="'cert-card--' + certState()" aria-label="Certification record">

  <!-- Status Badge (Neon Glow) -->
  <div class="cert-status-row">
    <span class="neon-badge" [class]="'neon-badge--' + certState()">
      <span class="neon-badge__dot"></span>
      {{ stateLabel() }}
    </span>
    @if (certState() === 'expiring') {
    <span class="expiry-countdown">
      {{ daysRemaining() }} days remaining
    </span>
    }
    @if (certState() === 'expired') {
    <span class="expiry-countdown expiry-countdown--overdue">
      Expired {{ -daysRemaining() }} days ago
    </span>
    }
  </div>

  <!-- Cert Name -->
  <h4 class="cert-name">{{ cert().certificationName }}</h4>

  <!-- Date Grid -->
  <div class="cert-dates">
    <div class="date-field">
      <span class="date-field__label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        </svg>
        Issued
      </span>
      <span class="date-field__value">{{ formatDate(cert().issueDate) }}</span>
    </div>
    <div class="date-field" [class.date-field--warn]="certState() !== 'active'">
      <span class="date-field__label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        Expires
      </span>
      <span class="date-field__value">{{ formatDate(cert().expiryDate) }}</span>
    </div>
  </div>

  <!-- Divider -->
  <div class="cert-divider"></div>

  <!-- Action Buttons (Line Art Icons) -->
  <div class="cert-actions">
    <button class="action-btn action-btn--edit" (click)="onEdit()" [disabled]="isProcessing()"
      [attr.aria-label]="'Edit ' + cert().certificationName" id="edit-cert-{{ cert().certId }}-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125" />
      </svg>
      Amend
    </button>
    <button class="action-btn action-btn--delete" (click)="onDelete()" [disabled]="isProcessing()"
      [attr.aria-label]="'Delete ' + cert().certificationName" id="delete-cert-{{ cert().certId }}-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
      </svg>
      Revoke
    </button>
  </div>

</article>
