<div class="cca" [class.cca--pulsing]="errors().length > 0" role="alert" aria-live="assertive">

    <div class="cca__glass" aria-hidden="true"></div>

    <div class="cca__header">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="cca__header__icon"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
        <span class="cca__header__title">Operational Conflicts Detected</span>
        <span class="cca__header__count">{{ errors().length }}</span>
        <button class="cca__clear-btn" type="button" (click)="clearAll.emit()" aria-label="Clear all conflict alerts">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <div class="cca__list">
        @for (err of errors(); track $index; let i = $index) {
        <div class="cca__item">
            <span class="cca__item__bullet" aria-hidden="true">⚠</span>
            <span class="cca__item__msg">{{ err }}</span>
            <button class="cca__item__dismiss" type="button" (click)="dismissError.emit(i)"
                aria-label="Dismiss conflict alert">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        }
    </div>

</div>
