<div class="fid-page">

    <!-- ══ Sticky Page Header ═════════════════════════════════════ -->
    <header class="fid-header">

        <!-- Left: Breadcrumb + Title -->
        <div>
            <nav class="fid-breadcrumb" aria-label="Breadcrumb">
                <span class="fid-breadcrumb__section">Fleet &amp; Asset Configuration</span>
                <svg class="fid-breadcrumb__sep" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
                </svg>
                <span class="fid-breadcrumb__current">Fleet Inventory</span>
            </nav>

            <h1 class="fid-title">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="fid-title__icon"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
                </svg>
                Fleet Assets
            </h1>
        </div>

        <!-- Right: Header Controls -->
        <div class="fid-header__controls">

            <!-- Error inline banner -->
            @if (store.error()) {
            <div class="fid-header__error" role="alert">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    class="fid-header__error__icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
                {{ store.error() }}
            </div>
            }

            <!-- Register Aircraft CTA -->
            <button class="fid-register-btn" type="button" (click)="navigateToRegister()"
                aria-label="Register new aircraft">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    class="fid-register-btn__icon" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Register Aircraft
            </button>

            <!-- Archival Center CTA -->
            <button class="fid-icon-btn" type="button" (click)="navigateToArchivalCenter()"
                aria-label="View Archival Center" title="Fleet Archival Center">
                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="fid-icon-btn__icon"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.118v0H5.622c-1.085-.082-1.872-1.024-1.872-2.118v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z" />
                </svg>
            </button>

            <!-- Refresh -->
            <button class="fid-icon-btn" type="button" [disabled]="store.loading()" (click)="store.refreshData()"
                aria-label="Refresh fleet data" title="Refresh Fleet Data">
                <svg class="fid-icon-btn__icon" [class.fid-icon-btn__icon--spin]="store.loading()" fill="none"
                    stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
                   3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
                   13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
            </button>

            <!-- Dark Mode Toggle -->
            <button class="fid-icon-btn fid-icon-btn--gold" type="button" (click)="toggleDarkMode()"
                [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
                @if (isDarkMode()) {
                <svg class="fid-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591
                     M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636
                     5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
                </svg>
                } @else {
                <svg class="fid-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75
                     0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365
                     21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z" />
                </svg>
                }
            </button>

        </div>

    </header>

    <!-- ══ Page Body ══════════════════════════════════════════════ -->
    <main class="fid-body">

        <!-- ── KPI Status Cards ──────────────────────────────────── -->
        <aoms-fleet-status-overview [stats]="store.fleetStats()" [loading]="store.loading()" />

        <!-- ── Advanced Filter Hub ───────────────────────────────── -->
        <aoms-aircraft-advanced-search [initialFilters]="store.filters()" [isLoading]="store.loading()"
            (filtersApplied)="onFiltersApplied($event)" (filtersReset)="onFiltersReset()" />

        <!-- ── Enterprise Data Ledger ────────────────────────────── -->
        <aoms-aircraft-data-dense-grid [aircraft]="store.aircraftList()" [pagination]="store.pagination()"
            [loading]="store.loading()" (viewSuite)="onViewSuite($event)" (pageChanged)="onPageChanged($event)"
            (nextPage)="onNextPage()" (prevPage)="onPrevPage()" />

    </main>

</div>
