<button class="rob" type="button" [class.rob--loading]="isReactivating()" [class.rob--restored]="justRestored()"
    [disabled]="isReactivating()" (click)="restoreClicked.emit(tailNumber())"
    [attr.aria-label]="'Restore aircraft ' + tailNumber() + ' to active service'" [attr.aria-busy]="isReactivating()">

    @if (!isReactivating() && !justRestored()) {
    <!-- Idle state: restore icon + label -->
    <svg class="rob__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
    </svg>
    Restore
    }

    @if (isReactivating()) {
    <!-- Loading state: champagne gold spinner -->
    <svg class="rob__icon rob__icon--spin" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
        aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
               3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
               13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    Restoring…
    }

    @if (justRestored() && !isReactivating()) {
    <!-- Success flash state -->
    <svg class="rob__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
    </svg>
    Restored
    }

</button>
