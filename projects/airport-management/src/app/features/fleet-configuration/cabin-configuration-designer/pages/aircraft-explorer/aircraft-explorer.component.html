<div class="explorer-page">

  <!-- ══ Sticky Header ══════════════════════════════════════════ -->
  <header class="explorer-header">

    <div>
      <nav class="explorer-breadcrumb" aria-label="Breadcrumb">
        <span class="explorer-breadcrumb__section">Fleet &amp; Asset Configuration</span>
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" class="explorer-breadcrumb__sep"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
        </svg>
        <span class="explorer-breadcrumb__current">LOPA Designer</span>
      </nav>

      <h1 class="explorer-title">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="explorer-title__icon"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5
                   m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3
                   1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061
                   12.061 0 0 1 16.5 7.605" />
        </svg>
        Aircraft Explorer
      </h1>
    </div>

    <!-- Right controls -->
    <div class="explorer-header__controls">

      @if (store.error()) {
      <div class="explorer-header__error" role="alert">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
          class="explorer-header__error__icon" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
        {{ store.error() }}
      </div>
      }

      <!-- Refresh -->
      <button class="explorer-icon-btn" type="button" [disabled]="store.loading()" (click)="store.refreshData()"
        title="Synchronize fleet data" aria-label="Refresh fleet data">
        <svg class="explorer-icon-btn__icon" [class.explorer-icon-btn__icon--spin]="store.loading()" fill="none"
          stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
                   3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
                   13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>

      <!-- Dark mode -->
      <button class="explorer-icon-btn explorer-icon-btn--gold" type="button" (click)="toggleDarkMode()"
        [attr.aria-label]="isDarkMode() ? 'Light mode' : 'Dark mode'">
        @if (isDarkMode()) {
        <svg class="explorer-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
        </svg>
        } @else {
        <svg class="explorer-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z" />
        </svg>
        }
      </button>

    </div>

  </header>

  <!-- ══ Page Body ══════════════════════════════════════════════ -->
  <main class="explorer-body">

    <!-- ── LOPA KPI Intelligence Bar ─────────────────────────── -->
    <aoms-lopa-fleet-kpi-bar [stats]="store.lopaKpiStats()" [loading]="store.loading()" />

    <!-- ── Filter Bar ─────────────────────────────────────────── -->
    <div class="explorer-filter-bar">

      <!-- Status dropdown -->
      <div class="explorer-filter-bar__field">
        <div class="explorer-select-wrap">
          <select class="explorer-select" aria-label="Filter by operational status" [(ngModel)]="statusQuery">
            @for (opt of statusOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            class="explorer-select-wrap__chevron" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
          </svg>
        </div>
        <span class="explorer-filter-bar__label">Operational Status</span>
      </div>

      <div class="explorer-filter-bar__spacer"></div>

      <!-- Reset -->
      @if (statusQuery) {
      <button class="explorer-reset-btn" type="button" (click)="onResetFilters()">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="explorer-reset-btn__icon"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        Clear
      </button>
      }

      <!-- Apply Filters -->
      <button class="explorer-apply-btn" type="button" [disabled]="store.loading()" (click)="onApplyFilters()">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="explorer-apply-btn__icon"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25
                   2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927
                   a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659
                   -1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917
                   -1.096A48.32 48.32 0 0 1 12 3z" />
        </svg>
        Apply Filters
      </button>

    </div>

    <!-- ── Executive Ledger ───────────────────────────────────── -->
    <aoms-aircraft-lopa-grid [rows]="store.lopaAircraftRows()" [pagination]="store.pagination()"
      [loading]="store.loading()" (manageLopa)="onManageLopa($event)" (pageChanged)="onPageChanged($event)"
      (nextPage)="onNextPage()" (prevPage)="onPrevPage()" />

  </main>

</div>
