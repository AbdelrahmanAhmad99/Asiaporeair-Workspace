<article class="ccs" [class.ccs--removing]="isRemoving()" [attr.data-type]="cabin().classType"
    [attr.aria-label]="cabin().name + ' cabin zone'">

    <!-- Corner ornament (decorative) -->
    <div class="ccs__ornament" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
            <path d="M0 0 L40 0 L40 40" stroke="rgba(226,199,128,0.15)" stroke-width="1" fill="none" />
        </svg>
    </div>

    <!-- ── Zone Type Badge ─────────────────────────────────────── -->
    <div class="ccs__badge-row">
        <span class="ccs__badge" [style.background]="cabin().visual.badgeColor"
            [style.color]="cabin().visual.textColor">
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="ccs__badge__icon"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="cabin().visual.iconPath" />
            </svg>
            {{ cabin().visual.label }}
        </span>

        <!-- Remove zone button — right-aligned -->
        <button class="ccs__remove-btn" type="button" [disabled]="isRemoving()"
            (click)="removeZone.emit(cabin().cabinClassId)" [attr.aria-label]="'Remove ' + cabin().name + ' zone'">
            @if (!isRemoving()) {
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166
                   m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25
                   0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397
                   m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397
                   m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32
                   0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
            }
            @if (isRemoving()) {
            <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                class="ccs__remove-btn__spinner" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
                   3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
                   13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            }
        </button>
    </div>

    <!-- ── Zone Name ──────────────────────────────────────────── -->
    <h3 class="ccs__name">{{ cabin().name }}</h3>

    <!-- ── Seat Count + Visual Bar ────────────────────────────── -->
    <div class="ccs__capacity">
        <div class="ccs__capacity__top">
            <span class="ccs__capacity__value">{{ cabin().seatCount }}</span>
            <span class="ccs__capacity__label">Seats Configured</span>
        </div>
        <!-- Seat indicator bar — visually represents how full the zone is -->
        <div class="ccs__capacity__bar-track" aria-hidden="true">
            @for (s of Array(Math.min(cabin().seatCount, 30)); track $index) {
            <span class="ccs__capacity__seat-dot"></span>
            }
            @if (cabin().seatCount > 30) {
            <span class="ccs__capacity__more">+{{ cabin().seatCount - 30 }}</span>
            }
        </div>
    </div>

    <!-- ── Design Seats CTA ───────────────────────────────────── -->
    <button class="ccs__design-btn" type="button" [disabled]="isRemoving()"
        (click)="designSeats.emit(cabin().cabinClassId)">
        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" class="ccs__design-btn__icon"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0
               0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1
               3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148
               A12.061 12.061 0 0 1 16.5 7.605" />
        </svg>
        Design Seats
    </button>

</article>
