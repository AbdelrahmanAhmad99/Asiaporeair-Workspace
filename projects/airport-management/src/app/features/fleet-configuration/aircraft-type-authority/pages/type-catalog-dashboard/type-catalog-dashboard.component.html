<!-- ── Page Shell ──────────────────────────────────────────────── -->
<div class="ata-page">

    <!-- ══ Sticky Page Header ════════════════════════════════════════ -->
    <header class="ata-header">

        <!-- Left: Breadcrumb + Title -->
        <div>
            <nav class="ata-breadcrumb" aria-label="Breadcrumb">
                <span class="ata-breadcrumb__section">Fleet &amp; Asset Configuration</span>
                <svg class="ata-breadcrumb__separator" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
                </svg>
                <span class="ata-breadcrumb__current">Aircraft Type Authority</span>
            </nav>
            <h1 class="ata-title">
                <svg class="ata-title__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12zm0 0h7.5" />
                </svg>
                Type Catalog
            </h1>
        </div>

        <!-- Right: Control Buttons -->
        <div class="ata-header-controls">

            <!-- Range Analyzer Button -->
            <button class="ata-nav-link" type="button" (click)="navigateToRangeAnalyzer()"
                title="Performance Range Analysis" aria-label="Navigate to range analyzer">
                <svg class="ata-nav-link__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125z" />
                </svg>
                Analyzer
            </button>

            <!-- Archive Button -->
            <button class="ata-nav-link" type="button" (click)="navigateToArchive()" title="View archived types"
                aria-label="Navigate to type archive">
                <svg class="ata-nav-link__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25
                    2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25
                    c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125
                    H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                </svg>
                Archive
            </button>

            <!-- Refresh Button -->
            <button class="ata-icon-btn" (click)="store.loadActiveTypes()" [disabled]="store.loading()"
                aria-label="Refresh aircraft types" title="Refresh data">
                <svg class="ata-icon-btn__icon" [class.ata-icon-btn__icon--spinning]="store.loading()" fill="none"
                    stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0
                   3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1
                   13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
            </button>

            <!-- Dark / Light Mode Toggle -->
            <button class="ata-icon-btn ata-icon-btn--gold" (click)="toggleDarkMode()"
                [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
                [attr.title]="isDarkMode() ? 'Light Mode' : 'Dark Mode'">

                @if (isDarkMode()) {
                <!-- Sun icon — shown in dark mode -->
                <svg class="ata-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591
                     M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636
                     5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
                </svg>
                }

                @if (!isDarkMode()) {
                <!-- Moon icon — shown in light mode -->
                <svg class="ata-icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75
                     0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365
                     21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z" />
                </svg>
                }
            </button>

        </div>
    </header>

    <!-- ══ Page Body ═════════════════════════════════════════════════ -->
    <main class="ata-body">

        <!-- Error Banner -->
        @if (store.error()) {
        <div class="ata-error-banner" role="alert">
            <svg class="ata-error-banner__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71
                   c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898
                   0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
            {{ store.error() }}
        </div>
        }

        <!-- Intelligence Layer: Statistics Cards -->
        <aoms-type-stats-cards [stats]="store.stats()" [loading]="store.loading()" />

        <!-- Control Deck: Search & Filter Bar -->
        <aoms-type-search-filter-bar [manufacturers]="store.manufacturers()" [initialFilters]="store.filters()"
            (filtersChanged)="onFiltersChanged($event)" (addType)="navigateToCreate()"
            (resetFilters)="onFiltersReset()" />

        <!-- Data Engine: High-Density Grid -->
        <aoms-type-data-grid [aircraftTypes]="store.filteredTypes()" [loading]="store.loading()"
            (actionTriggered)="onGridAction($event)" />

    </main>
</div>
