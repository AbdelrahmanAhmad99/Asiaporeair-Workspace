<header class="nav-header" role="banner">

    <!-- ── Left: Breadcrumb + Model Identity ──────────────────── -->
    <div class="nav-header__left">

        <!-- Breadcrumb trail -->
        <nav class="nav-header__breadcrumb" aria-label="Breadcrumb">
            <button class="nav-header__back-link" (click)="actionTriggered.emit('back')"
                aria-label="Return to Fleet Type Catalog">
                <svg class="nav-header__back-link__arrow" fill="none" stroke="currentColor" stroke-width="1.5"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Return to Fleet
            </button>

            <svg class="nav-header__breadcrumb__sep" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>

            <span class="nav-header__breadcrumb__section">Fleet &amp; Asset Configuration</span>

            <svg class="nav-header__breadcrumb__sep" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>

            <span class="nav-header__breadcrumb__current">Technical Profile</span>
        </nav>

        <!-- Model title  -->
        <div class="nav-header__identity">
            @if (isLoading()) {
            <div class="nav-header__identity__shimmer-title" aria-hidden="true"></div>
            <div class="nav-header__identity__shimmer-sub" aria-hidden="true"></div>
            }

            @if (!isLoading() && aircraftType()) {
            <h1 class="nav-header__title">
                {{ aircraftType()!.model }}
            </h1>
            <p class="nav-header__subtitle">
                {{ aircraftType()!.manufacturer }}
                <span class="nav-header__subtitle__dot" aria-hidden="true">·</span>
                Type ID #{{ aircraftType()!.typeId }}
            </p>
            }
        </div>

    </div>

    <!-- ── Right: Action Controls ─────────────────────────────── -->
    <div class="nav-header__actions">

        <!-- Print Technical Manual -->
        <button class="nav-header__btn nav-header__btn--ghost" (click)="actionTriggered.emit('print')"
            aria-label="Print technical manual" title="Print Technical Manual"
            [disabled]="isLoading() || !aircraftType()">
            <svg class="nav-header__btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56
                 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0
                 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12
                 -1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768
                 -2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25
                 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1
                 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504
                 -1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008
                 v.008H18V10.5zm-3 0h.008v.008H15V10.5z" />
            </svg>
            <span class="nav-header__btn__label">Print Manual</span>
        </button>

        <!-- Divider -->
        <div class="nav-header__divider" aria-hidden="true"></div>

        <!-- Archive Model (outlined ruby/warning tone) -->
        <button class="nav-header__btn nav-header__btn--archive" (click)="actionTriggered.emit('archive')"
            aria-label="Archive this aircraft type" title="Archive Model" [disabled]="isLoading() || !aircraftType()">
            <svg class="nav-header__btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1
                 -2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125
                 -1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125
                 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
            </svg>
            <span class="nav-header__btn__label">Archive Model</span>
        </button>

        <!-- Modify Specifications (Royal Gold primary) -->
        <button class="nav-header__btn nav-header__btn--primary" (click)="actionTriggered.emit('edit')"
            aria-label="Modify aircraft type specifications" title="Modify Specifications"
            [disabled]="isLoading() || !aircraftType()">
            <svg class="nav-header__btn__icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5
                 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931zm0
                 0L19.5 7.125" />
            </svg>
            Modify Specifications
        </button>

        <!-- Dark / Light Mode Toggle -->
        <button class="nav-header__icon-btn" (click)="darkModeToggled.emit()"
            [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
            [title]="isDarkMode() ? 'Light Mode' : 'Dark Mode'">

            @if (isDarkMode()) {
            <svg class="nav-header__icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591
                   M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636
                   5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
            </svg>
            }

            @if (!isDarkMode()) {
            <svg class="nav-header__icon-btn__icon" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75
                   0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365
                   21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z" />
            </svg>
            }
        </button>

    </div>

</header>
