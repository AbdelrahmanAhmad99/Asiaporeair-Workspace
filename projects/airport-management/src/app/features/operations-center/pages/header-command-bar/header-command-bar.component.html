<header class="command-bar" aria-label="Operations Center command bar">
    <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
            <rect x="1.5" y="1.5" width="29" height="29" rx="8" />
            <path d="M8 21 16 9l8 12" />
            <path d="M11.5 21h9" />
        </svg>
        <div class="brand__text">
            <span class="brand__name">Asiaporeair</span>
            <span class="brand__product">{{ productName() }}</span>
        </div>
    </div>

    <aoms-global-quick-search class="search" [fleet]="store.airborneFleet()"
        (searchSubmitted)="onSearchSubmitted($event)" />

    <aoms-live-clock-zulu class="clock segment" [epochMs]="store.zuluTimeSignal()" [hubTimeZone]="hubTimeZone()" />

    <aoms-system-health-indicator class="health segment" [health]="store.systemHealth()"
        [connection]="store.connectionStatus()" [recovery]="store.connectionRecovery()"
        [isTelemetryStale]="store.isTelemetryStale()" [lastSyncedAt]="store.lastSyncedAt()"
        [isRefreshing]="store.isLoading()" (refreshRequested)="onRefreshRequested()" />

    <aoms-user-profile-role-badge class="profile segment" [operator]="operator()"
        (activated)="profileMenuRequested.emit()" />
</header>
