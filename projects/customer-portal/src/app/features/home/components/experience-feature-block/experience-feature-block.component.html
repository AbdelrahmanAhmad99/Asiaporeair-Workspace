<div class="efb" [class.efb--image-left]="feature.imageLeft" [class.efb--visible]="isVisible">
    <!-- Image side -->
    <div class="efb__image-side">
        <div class="efb__image-wrap">
            <img class="efb__image" [src]="feature.imageUrl" [alt]="feature.headline" loading="lazy" />
            <div class="efb__image-overlay" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Text side -->
    <div class="efb__text-side">
        <div class="efb__text-inner">
            <p class="efb__eyebrow">{{ feature.eyebrow }}</p>
            <h2 class="efb__headline">{{ feature.headline }}</h2>
            <div class="efb__divider" aria-hidden="true"></div>
            <p class="efb__body">{{ feature.body }}</p>
            <a class="efb__cta" [routerLink]="feature.ctaRoute">
                {{ feature.ctaLabel }}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </a>
        </div>
    </div>
</div>
