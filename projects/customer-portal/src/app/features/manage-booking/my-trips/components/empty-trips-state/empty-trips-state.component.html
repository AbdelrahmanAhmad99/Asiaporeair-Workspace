<!-- empty-trips-state.component.html -->

<div class="empty-state" role="status" aria-live="polite">

    <!-- Animated Plane Illustration -->
    <div class="plane-orbit" aria-hidden="true">
        <div class="orbit-ring orbit-ring--outer"></div>
        <div class="orbit-ring orbit-ring--inner"></div>
        <div class="plane-wrapper">
            <svg class="plane-svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#E2C780"
                stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5c-1.5-1.5-3.5-1.5-5 0L11 6 2.8 4.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />
            </svg>
        </div>
    </div>

    <!-- Copy -->
    <h2 class="empty-heading">No trips found</h2>
    <p class="empty-subtext">{{ subText }}</p>

    <!-- CTA -->
    <button class="btn-begin-journey" (click)="beginJourney.emit()"
        aria-label="Begin Your Journey — search for a flight">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            aria-hidden="true">
            <path
                d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5c-1.5-1.5-3.5-1.5-5 0L11 6 2.8 4.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />
        </svg>
        Begin Your Journey
    </button>

</div>
