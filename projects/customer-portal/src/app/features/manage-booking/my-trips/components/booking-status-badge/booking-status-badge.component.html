<span class="badge" role="status" [style.background]="config.bg" [style.border-color]="config.border"
    [style.color]="config.color" [attr.aria-label]="'Booking status: ' + config.label">
    <span class="dot" [style.background]="config.color" aria-hidden="true"></span>
    {{ config.label }}
</span>
