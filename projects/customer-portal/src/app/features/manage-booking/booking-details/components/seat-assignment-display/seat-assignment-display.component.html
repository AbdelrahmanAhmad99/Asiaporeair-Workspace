<!-- seat-assignment-display.component.html -->
<div class="seat-grid-wrap" role="list" aria-label="Seat assignments">
    <div *ngFor="let pax of seatedPassengers; trackBy: trackByPax" class="seat-card" role="listitem"
        [attr.aria-label]="pax.firstName + ' ' + pax.lastName + ' seat ' + pax.assignedSeatNumber">

        <!-- Mini aircraft silhouette -->
        <div class="aircraft-mini" aria-hidden="true">
            <svg width="56" height="80" viewBox="0 0 56 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M28 2 C18 2 8 20 6 40 L50 40 C48 20 38 2 28 2Z" stroke="rgba(226,199,128,0.2)" stroke-width="1"
                    fill="rgba(5,25,55,0.4)" />
                <rect x="6" y="40" width="44" height="28" rx="2" stroke="rgba(226,199,128,0.2)" stroke-width="1"
                    fill="rgba(5,25,55,0.4)" />
                <line x1="28" y1="40" x2="28" y2="68" stroke="rgba(226,199,128,0.1)" stroke-width="1"
                    stroke-dasharray="3 3" />
                <!-- Seat indicator dot -->
                <circle cx="28" cy="52" r="5" fill="#B68F24" opacity="0.9" filter="url(#glow)" />
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="1.5" result="coloredBlur" />
                        <feMerge>
                            <feMergeNode in="coloredBlur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
            </svg>
        </div>

        <!-- Seat Details -->
        <div class="seat-info">
            <div class="seat-number-block">
                <span class="seat-row-num">{{ getSeatRow(pax.assignedSeatNumber!) }}</span>
                <span class="seat-letter">{{ getSeatLetter(pax.assignedSeatNumber!) }}</span>
            </div>

            <div class="seat-attributes">
                <span *ngIf="isWindowSeat(getSeatLetter(pax.assignedSeatNumber!))" class="attr-chip">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                        aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="3" />
                        <circle cx="12" cy="12" r="4" />
                    </svg>
                    Window
                </span>
                <span *ngIf="isAisleSeat(getSeatLetter(pax.assignedSeatNumber!))" class="attr-chip">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                        aria-hidden="true">
                        <path d="M5 12h14" />
                        <path d="M12 5l7 7-7 7" />
                    </svg>
                    Aisle
                </span>
                <span *ngIf="pax.cabinClassName" class="attr-chip attr-chip--cabin">{{ pax.cabinClassName }}</span>
            </div>

            <div class="seat-pax-name">{{ pax.firstName }} {{ pax.lastName }}</div>
        </div>

    </div>
</div>
