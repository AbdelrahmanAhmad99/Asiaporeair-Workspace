<!-- ancillary-services-list.component.html -->
<div class="services-list" role="list" aria-label="Purchased ancillary services">
    <div *ngFor="let sale of sales; trackBy: trackBySale" class="service-row" role="listitem"
        [attr.aria-label]="sale.productName + ', quantity ' + sale.quantity + ', total ' + currency + ' ' + formatPrice(sale.pricePaid * sale.quantity)">

        <div class="service-icon" aria-hidden="true">
            <!-- Meal -->
            <svg *ngIf="getIconKey(sale.productName) === 'meal'" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1">
                <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
                <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
            </svg>
            <!-- Baggage -->
            <svg *ngIf="getIconKey(sale.productName) === 'baggage'" width="14" height="14" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1">
                <rect x="6" y="8" width="12" height="13" rx="2" />
                <path d="M9 8V6a3 3 0 0 1 6 0v2" />
            </svg>
            <!-- Medical/Oxygen -->
            <svg *ngIf="getIconKey(sale.productName) === 'medical'" width="14" height="14" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                <line x1="12" y1="8" x2="12" y2="16" />
                <line x1="8" y1="12" x2="16" y2="12" />
            </svg>
            <!-- Lounge -->
            <svg *ngIf="getIconKey(sale.productName) === 'lounge'" width="14" height="14" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1">
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
            <!-- Default -->
            <svg *ngIf="getIconKey(sale.productName) === 'default' || getIconKey(sale.productName) === 'insurance' || getIconKey(sale.productName) === 'seat' || getIconKey(sale.productName) === 'wifi'"
                width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        </div>

        <div class="service-info">
            <span class="service-name">{{ sale.productName }}</span>
            <span *ngIf="sale.quantity > 1" class="service-qty">×{{ sale.quantity }}</span>
        </div>

        <div class="service-price-col">
            <span class="unit-price">{{ currency }} {{ formatPrice(sale.pricePaid) }} each</span>
            <span class="line-total">{{ currency }} {{ formatPrice(sale.pricePaid * sale.quantity) }}</span>
        </div>

    </div>

    <!-- Total row -->
    <div class="services-total" role="row" aria-label="Total ancillary cost">
        <span class="total-label">Enhancements Total</span>
        <span class="total-value">{{ currency }} {{ formatPrice(total) }}</span>
    </div>
</div>
