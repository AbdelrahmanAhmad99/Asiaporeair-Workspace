<!-- ============================================================================
     quick-links-panel.component.html
     Asiaporeair | Quick Links Panel — Flight Status + Access Your Suite
     ============================================================================ -->

<div class="qlp-panel">

  <h4 class="qlp-panel__title">Explore More Services</h4>

  <!-- ── Link: Check Flight Status ─────────────────────────────────────── -->
  <button
    class="qlp-card"
    type="button"
    (click)="onCheckFlightStatus()"
    aria-label="Check real-time flight status">

    <div class="qlp-card__icon-wrap" aria-hidden="true">
      <!-- Plane icon (1px line art) -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </div>

    <div class="qlp-card__content">
      <span class="qlp-card__label">Check Flight Status</span>
      <span class="qlp-card__desc">Track departures, arrivals &amp; delays in real time.</span>
    </div>

    <svg class="qlp-card__arrow" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>

  </button>

  <!-- ── Link: Access Your Suite (Login) ───────────────────────────────── -->
  <button
    class="qlp-card qlp-card--suite"
    type="button"
    (click)="onAccessSuite()"
    aria-label="Sign in to Access Your Suite">

    <div class="qlp-card__icon-wrap qlp-card__icon-wrap--gold" aria-hidden="true">
      <!-- Key icon (1px line art) -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
    </div>

    <div class="qlp-card__content">
      <span class="qlp-card__label">Access Your Suite</span>
      <span class="qlp-card__desc">Sign in to view all bookings, itineraries &amp; preferences.</span>
    </div>

    <svg class="qlp-card__arrow" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </svg>

  </button>

</div>
