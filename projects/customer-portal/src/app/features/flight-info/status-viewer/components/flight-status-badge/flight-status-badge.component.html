<div class="badge" [attr.data-category]="presentation().category" [class.badge--pulse]="presentation().dotPulse"
    role="status" [attr.aria-label]="'Flight status: ' + presentation().label">

    <!-- Live pulse dot -->
    <span class="badge__dot" aria-hidden="true"></span>

    <!-- Status label -->
    <span class="badge__text">{{ presentation().label }}</span>

    <!-- Airborne icon -->
    @if (presentation().dotPulse) {
    <svg class="badge__plane" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1" aria-hidden="true">
        <path
            d="M17.8 19.2L16 11l3.5-3.5C21 6 21 4 19.5 2.5S18 2 16.5 3.5L13 7 4.8 5.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />
    </svg>
    }

</div>
