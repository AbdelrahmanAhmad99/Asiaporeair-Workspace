<!-- ============================================================================
     fare-benefits-list.component.html
     Asiaporeair | Fare Benefits Checklist
     ============================================================================ -->

<div class="fbl-wrap" role="list" [attr.aria-label]="'Benefits for ' + code + ' fare'">

    @for (group of benefitGroups(); track group.cat) {

    <div class="fbl-group" role="group" [attr.aria-label]="group.cat">

        <!-- Category header -->
        <div class="fbl-group-header" aria-hidden="true">
            <div class="fbl-group-header__line"></div>
            <span class="fbl-group-header__label">{{ group.cat }}</span>
        </div>

        <!-- Benefit items -->
        @for (benefit of group.benefits; track benefit.label) {
        <div class="fbl-item" [class.fbl-item--excluded]="!benefit.included" role="listitem"
            [attr.aria-label]="benefit.label + (benefit.included ? ' — Included' : ' — Not included')">

            <!-- Checkmark / cross icon -->
            <div class="fbl-item__icon" aria-hidden="true">
                @if (benefit.included) {
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B68F24" stroke-width="2.5"
                    stroke-linecap="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                } @else {
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                }
            </div>

            <span class="fbl-item__label">{{ benefit.label }}</span>

        </div>
        }

    </div>

    }

</div>
