<!-- password-strength-meter.component.html -->
<div class="psm" role="status" [attr.aria-label]="'Password strength: ' + result().label">

    <div class="psm__bar" aria-hidden="true">
        @for (i of segments; track i) {
        <div class="psm__segment" [class.psm__segment--active]="isSegmentActive(i)" [attr.data-level]="result().level">
        </div>
        }
    </div>

    <div class="psm__footer">
        <span class="psm__label" [attr.data-level]="result().level">
            {{ result().label }}
        </span>
        <span class="psm__hint">{{ result().hint }}</span>
    </div>

</div>
