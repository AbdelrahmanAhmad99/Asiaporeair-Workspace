<!-- ============================================================================
     action-buttons-group.component.html
     Asiaporeair | Boarding Pass Action Bar
     Download · Email · Navigate
     ============================================================================ -->

<div class="abg-container">

    <!-- ── Primary action row ───────────────────────────────────────────── -->
    <div class="abg-row abg-row--primary">

        <!-- Download PDF -->
        <button class="abg-btn abg-btn--primary" type="button" [disabled]="isDownloading"
            [attr.aria-busy]="isDownloading" (click)="downloadPdf.emit()" aria-label="Download boarding pass as PDF">

            @if (!isDownloading) {
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download Pass
            }

            @if (isDownloading) {
            <svg class="abg-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
            Preparing PDF…
            }

        </button>

        <!-- Send to Email toggle -->
        <button class="abg-btn abg-btn--secondary" type="button" [class.abg-btn--active]="showEmailForm()"
            (click)="toggleEmailForm()" aria-label="Send boarding pass to email">

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
            </svg>
            Send to Email

        </button>

    </div>

    <!-- ── Email form (inline, animated) ────────────────────────────────── -->
    @if (showEmailForm()) {
    <div class="abg-email-panel" role="region" aria-label="Send boarding pass by email">

        @if (!emailSent()) {
        <div class="abg-email-form">

            <div class="abg-email-field" [class.abg-email-field--error]="!!emailError()">
                <label class="abg-email-label" for="email-input">Email address</label>
                <div class="abg-email-input-row">
                    <input id="email-input" class="abg-email-input" type="email" autocomplete="email"
                        placeholder="your@email.com" [value]="emailValue()" (input)="onEmailInput($event)"
                        [attr.aria-invalid]="!!emailError()"
                        [attr.aria-describedby]="emailError() ? 'email-err' : null" />

                    <button class="abg-email-submit" type="button" [disabled]="isSendingEmail"
                        (click)="onSendEmailSubmit()" aria-label="Send boarding pass to email address">

                        @if (!isSendingEmail) {
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13" />
                            <polygon points="22 2 15 22 11 13 2 9 22 2" />
                        </svg>
                        }

                        @if (isSendingEmail) {
                        <svg class="abg-spin" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                        </svg>
                        }
                    </button>
                </div>

                @if (emailError()) {
                <p id="email-err" class="abg-email-error" role="alert">{{ emailError() }}</p>
                }
            </div>

        </div>
        }

        @if (emailSent()) {
        <div class="abg-email-sent" role="status" aria-live="polite">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            Your boarding pass has been sent.
        </div>
        }

    </div>
    }

    <!-- ── Navigation row ───────────────────────────────────────────────── -->
    <div class="abg-row abg-row--nav">

        <!-- Check in another passenger -->
        <button class="abg-btn abg-btn--ghost" type="button" (click)="checkInAnother.emit()"
            aria-label="Check in another passenger">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <line x1="19" y1="8" x2="19" y2="14" />
                <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
            Check in Another
        </button>

        <!-- Return to Main Suite -->
        <button class="abg-btn abg-btn--home" type="button" (click)="returnToHome.emit()"
            aria-label="Return to Asiaporeair main suite">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Return to Main Suite
        </button>

    </div>

</div>
