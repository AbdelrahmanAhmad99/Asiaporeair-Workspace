@if (visible()) {
<div class="celebration" aria-hidden="true">

    <!-- Central gold burst ring -->
    <div class="celebration__ring"></div>
    <div class="celebration__ring celebration__ring--2"></div>

    <!-- Central icon -->
    <div class="celebration__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E2C780" stroke-width="2"
            stroke-linecap="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
    </div>

    <!-- Gold particle flecks -->
    @for (p of particles; track p) {
    <div class="fleck" [style]="p.style"></div>
    }

</div>
}
