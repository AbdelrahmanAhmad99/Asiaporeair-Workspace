<div class="error-state" role="alert">

    <!-- Animated icon ring -->
    <div class="error-icon-ring" [attr.data-type]="presentation().iconType" aria-hidden="true">
        @if (presentation().iconType === 'search') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
        }
        @if (presentation().iconType === 'clock') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76" />
        </svg>
        }
        @if (presentation().iconType === 'wifi') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <line x1="1" y1="1" x2="23" y2="23" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
        }
        @if (presentation().iconType === 'lock') {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            <circle cx="12" cy="16" r="1" fill="currentColor" />
        </svg>
        }
    </div>

    <!-- Message block -->
    <div class="error-message-block">
        <h3 class="error-heading">{{ presentation().heading }}</h3>
        <p class="error-body">{{ errorMessage || presentation().body }}</p>
    </div>

    <!-- CTA button -->
    <button class="error-cta" type="button" (click)="onRetry.emit()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            aria-hidden="true">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 .49-3.93" />
        </svg>
        {{ presentation().ctaLabel }}
    </button>

    <!-- Subtle divider + help link -->
    <div class="error-footer">
        <span>Need assistance?</span>
        <a class="error-help-link" href="#" aria-label="Contact Asiaporeair concierge support">
            Contact Concierge
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                aria-hidden="true">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
            </svg>
        </a>
    </div>

</div>
