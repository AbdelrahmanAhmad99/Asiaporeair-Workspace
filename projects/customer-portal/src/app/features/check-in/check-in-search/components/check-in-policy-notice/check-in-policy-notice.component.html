<!-- ============================================================================
     check-in-policy-notice.component.html
     Asiaporeair | Check-in Policy — Accordion Panel
     ============================================================================ -->

<div class="policy-card" [class.policy-card--open]="isExpanded()">

    <!-- ── Accordion header ──────────────────────────────────────────────── -->
    <button class="policy-header" type="button" (click)="isExpanded.set(!isExpanded())"
        [attr.aria-expanded]="isExpanded()" aria-controls="policy-body">

        <div class="policy-header__left">
            <div class="policy-icon-ring" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E2C780" stroke-width="1"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="12" />
                    <line x1="12" y1="16" x2="12.01" y2="16" />
                </svg>
            </div>
            <div class="policy-header__text">
                <span class="policy-header__title">Check-in Guidelines</span>
                <span class="policy-header__sub">Windows, documents &amp; allowances</span>
            </div>
        </div>

        <svg class="policy-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" [class.rotated]="isExpanded()" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
        </svg>
    </button>

    <!-- ── Accordion body ────────────────────────────────────────────────── -->
    @if (isExpanded()) {
    <div class="policy-body" id="policy-body" role="region" aria-label="Check-in guidelines">

        @for (item of policies; track item.title) {
        <div class="policy-item" [class.policy-item--highlight]="item.isHighlight">

            <div class="policy-item__icon-col" aria-hidden="true">
                @if (item.icon === 'clock') {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linecap="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                }
                @if (item.icon === 'passport') {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linecap="round">
                    <rect x="3" y="2" width="18" height="20" rx="2" />
                    <circle cx="12" cy="10" r="3" />
                    <path d="M9 20h6" />
                </svg>
                }
                @if (item.icon === 'luggage') {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linecap="round">
                    <rect x="6" y="7" width="12" height="14" rx="2" />
                    <path d="M9 7V5a3 3 0 0 1 6 0v2" />
                    <line x1="12" y1="12" x2="12" y2="16" />
                </svg>
                }
                @if (item.icon === 'shield') {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                    stroke-linecap="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
                }
            </div>

            <div class="policy-item__text">
                <span class="policy-item__title">{{ item.title }}</span>
                <p class="policy-item__detail">{{ item.detail }}</p>
            </div>

        </div>
        }

    </div>
    }

</div>
