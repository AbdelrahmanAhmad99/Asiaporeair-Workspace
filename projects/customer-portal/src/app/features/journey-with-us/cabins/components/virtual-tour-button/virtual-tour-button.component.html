<button class="vtb" type="button" (click)="clicked.emit()" [attr.aria-label]="label">
    <!-- Animated ring -->
    <span class="vtb__ring" aria-hidden="true"></span>

    <!-- Play icon -->
    <span class="vtb__icon-wrap" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10" />
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
        </svg>
    </span>

    <span class="vtb__label">{{ label }}</span>

    <svg class="vtb__arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
    </svg>
</button>
