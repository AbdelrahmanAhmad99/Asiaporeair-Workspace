<article class="miles-widget" aria-label="Miles Balance Widget">

    <!-- ── Shimmer Skeleton ─────────────────────────────────────────────── -->
    @if (isLoading()) {
    <div class="miles-widget__skeleton">
        <div class="skeleton-ring"></div>
        <div class="skeleton-lines">
            <div class="skeleton-line skeleton-line--medium"></div>
            <div class="skeleton-line skeleton-line--narrow"></div>
        </div>
    </div>
    }

    <!-- ── Content ──────────────────────────────────────────────────────── -->
    @if (!isLoading()) {
    <div class="miles-widget__inner">

        <!-- SVG Circular Progress Ring -->
        <div class="miles-widget__ring-wrap" aria-hidden="true">
            <svg class="miles-widget__ring" [attr.width]="(radius * 2) + strokeWidth * 2"
                [attr.height]="(radius * 2) + strokeWidth * 2"
                [attr.viewBox]="'0 0 ' + ((radius * 2) + strokeWidth * 2) + ' ' + ((radius * 2) + strokeWidth * 2)">

                <!-- Track circle -->
                <circle class="ring-track" [attr.cx]="radius + strokeWidth" [attr.cy]="radius + strokeWidth"
                    [attr.r]="radius" fill="none" [attr.stroke-width]="strokeWidth">
                </circle>

                <!-- Progress arc -->
                <circle class="ring-progress" [attr.cx]="radius + strokeWidth" [attr.cy]="radius + strokeWidth"
                    [attr.r]="radius" fill="none" [attr.stroke-width]="strokeWidth" stroke-linecap="round"
                    [attr.stroke-dasharray]="circumference()" [attr.stroke-dashoffset]="dashOffset()"
                    [attr.transform]="'rotate(-90 ' + (radius + strokeWidth) + ' ' + (radius + strokeWidth) + ')'">
                </circle>
            </svg>

            <!-- Centre text overlay -->
            <div class="miles-widget__ring-centre">
                <span class="miles-widget__balance-value">{{ formattedBalance }}</span>
                <span class="miles-widget__balance-label">Award Miles</span>
            </div>
        </div>

        <!-- Caption row -->
        <div class="miles-widget__caption">
            <p class="miles-widget__caption-main">Total Miles Balance</p>
            <p class="miles-widget__caption-sub">Updated in real time</p>
        </div>

        <!-- Expiry alert -->
        @if (hasExpiring) {
        <div class="miles-widget__expiry" role="alert" aria-live="polite">
            <!-- Thin line-art alert icon -->
            <svg class="expiry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            <span>
                <strong>{{ formattedExpiring }}</strong> miles expiring within 90 days
            </span>
        </div>
        }
    </div>
    }

</article>
