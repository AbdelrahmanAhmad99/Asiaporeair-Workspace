<button class="category-card" [class.card--expanded]="isExpanded()" [class.card--has-selections]="selectedCount() > 0"
    (click)="onCardClick()" [attr.aria-expanded]="isExpanded()"
    [attr.aria-label]="label() + ': ' + productCount() + ' options. ' + (selectedCount() > 0 ? selectedCount() + ' selected.' : '')">

    <!-- Icon Slot -->
    <div class="card-icon" aria-hidden="true">

        <!-- BAGGAGE -->
        <svg *ngIf="iconKey() === 'baggage'" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1">
            <rect x="6" y="8" width="12" height="13" rx="2" />
            <path d="M9 8V6a3 3 0 0 1 6 0v2" />
            <line x1="12" y1="12" x2="12" y2="16" />
            <line x1="10" y1="14" x2="14" y2="14" />
        </svg>

        <!-- MEAL -->
        <svg *ngIf="iconKey() === 'meal'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
            <line x1="6" y1="1" x2="6" y2="4" />
            <line x1="10" y1="1" x2="10" y2="4" />
            <line x1="14" y1="1" x2="14" y2="4" />
        </svg>

        <!-- LOUNGE -->
        <svg *ngIf="iconKey() === 'lounge'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1">
            <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>

        <!-- SEAT -->
        <svg *ngIf="iconKey() === 'seat'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1">
            <path d="M6 3v11" />
            <path d="M18 3v11" />
            <path d="M6 14a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4" />
            <line x1="6" y1="21" x2="6" y2="18" />
            <line x1="18" y1="21" x2="18" y2="18" />
        </svg>

        <!-- INSURANCE -->
        <svg *ngIf="iconKey() === 'insurance'" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>

        <!-- WIFI -->
        <svg *ngIf="iconKey() === 'wifi'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M1.42 9a16 16 0 0 1 21.16 0" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>

        <!-- DEFAULT / FALLBACK -->
        <svg *ngIf="!['baggage','meal','lounge','seat','insurance','wifi'].includes(iconKey())" width="22" height="22"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <polygon
                points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
        </svg>
    </div>

    <!-- Card Body -->
    <div class="card-body">
        <div class="card-header-row">
            <span class="card-label">{{ label() }}</span>
            <span *ngIf="selectedCount() > 0" class="selected-badge" aria-hidden="true">
                {{ selectedCount() }} added
            </span>
        </div>
        <p class="card-desc">{{ description() }}</p>
        <span class="card-meta">
            {{ productCount() }} {{ productCount() === 1 ? 'option' : 'options' }} available
        </span>
    </div>

    <!-- Expand Chevron -->
    <div class="card-chevron" aria-hidden="true">
        <svg class="chevron-icon" [class.chevron--open]="isExpanded()" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="6 9 12 15 18 9" />
        </svg>
    </div>

</button>
