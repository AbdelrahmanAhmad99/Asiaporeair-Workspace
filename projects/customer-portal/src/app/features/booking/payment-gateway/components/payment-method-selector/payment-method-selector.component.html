<!-- payment-method-selector.component.html -->

<div class="method-grid" role="radiogroup" aria-label="Select payment method">

    <button *ngFor="let method of methods(); trackBy: trackByKey" class="method-card"
        [class.method-card--selected]="selectedMethod() === method.key" (click)="onSelect(method.key)" role="radio"
        [attr.aria-checked]="selectedMethod() === method.key" [attr.aria-label]="method.label">

        <!-- Radio Indicator -->
        <div class="radio-dot" aria-hidden="true">
            <div class="radio-inner" [class.radio-inner--checked]="selectedMethod() === method.key"></div>
        </div>

        <!-- Label & Description -->
        <div class="method-info">
            <span class="method-label">{{ method.label }}</span>
            <span class="method-desc">{{ method.description }}</span>
        </div>

        <!-- Provider Logos -->
        <div class="method-logos" aria-hidden="true">

            <!-- Credit Card logos -->
            <ng-container *ngIf="method.iconType === 'card'">
                <!-- Visa -->
                <svg class="card-logo" viewBox="0 0 38 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    aria-label="Visa">
                    <rect width="38" height="24" rx="3" fill="#1A1F71" />
                    <text x="5" y="17" font-family="Arial" font-size="11" font-weight="bold" fill="white"
                        letter-spacing="0">VISA</text>
                </svg>
                <!-- Mastercard -->
                <svg class="card-logo" viewBox="0 0 38 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                    aria-label="Mastercard">
                    <rect width="38" height="24" rx="3" fill="#252525" />
                    <circle cx="14" cy="12" r="7" fill="#EB001B" opacity="0.9" />
                    <circle cx="24" cy="12" r="7" fill="#F79E1B" opacity="0.9" />
                    <path d="M19 7.1a7 7 0 0 1 0 9.8A7 7 0 0 1 19 7.1z" fill="#FF5F00" />
                </svg>
                <!-- JCB placeholder -->
                <svg class="card-logo card-logo--sm" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg"
                    aria-label="JCB">
                    <rect width="28" height="20" rx="2" fill="#003087" />
                    <text x="4" y="14" font-family="Arial" font-size="7" font-weight="bold" fill="white">JCB</text>
                </svg>
            </ng-container>

            <!-- PayPal -->
            <ng-container *ngIf="method.iconType === 'paypal'">
                <svg class="card-logo card-logo--wide" viewBox="0 0 80 28" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-label="PayPal">
                    <rect width="80" height="28" rx="3" fill="#F5F5F5" />
                    <text x="8" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#003087">Pay</text>
                    <text x="32" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#009CDE">Pal</text>
                </svg>
            </ng-container>

            <!-- AMEX -->
            <ng-container *ngIf="method.iconType === 'amex'">
                <svg class="card-logo card-logo--wide" viewBox="0 0 80 28" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-label="American Express">
                    <rect width="80" height="28" rx="3" fill="#016FD0" />
                    <text x="6" y="19" font-family="Arial" font-size="9" font-weight="bold" fill="white"
                        letter-spacing="0.5">AMERICAN EXPRESS</text>
                </svg>
            </ng-container>

        </div>

    </button>

</div>
